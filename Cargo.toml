[package]
name = "blenderesque_transform_gizmos"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", features = ["mesh_picking"] }
bevy_mod_outline = "0.13"


[dev-dependencies]
# Enable this only for dev builds (examples, tests, benchmarks)
bevy = { version = "0.19.0", features = ["mesh_picking", "bevy_dev_tools"] }
bevy-inspector-egui = "0.37.0"
bevy_egui = "0.40.0"
